[mgr]

ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
show_hidden = false
show_symlink = true
scrolloff = 8 

[preview]
wrap = "yes"
max_width = 2000
max_height = 2000



[opener]
edit = [
  {run = "hx -w %d1 %s1", block = true, for = "unix"}
]

edit_dir = [
  {run = "hx -w %d1", block = true, for = "unix"}
]

play = [
  {run = "vlc %s", block = true, for = "unix"}
]

gif = [
  {run = "librewolf file://%s", block = true, for = "unix"}
]

pdf = [
 { run = "zathura %s", block = true, for = "unix"}
]

document = [
 { run = "libreoffice %s", block = true, for = "unix"}
]


[open]
rules = [
  { mime = "text/*", use = "edit"},
  { mime = "application/json", use = "edit"},
  { mime = "application/octet-stream", use = "edit"},

  { mime = "folder/local", use = "edit_dir"},

  { mime = "video/*", use = "play"},
  { mime = "image/gif", use = "gif"},
  { mime = "audio/*", use = "play"},

  { mime = "application/oasis.*", use = "document"},

  { mime = "application/pdf*", use = "pdf"},

  { mime = "*", use = "edit"},
]
